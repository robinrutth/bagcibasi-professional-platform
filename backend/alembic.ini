[alembic]
script_location = %(here)s/alembic

# Runtime database URL is loaded in alembic/env.py from DATABASE_URL / app settings.
# Keep this fallback local-development friendly and non-authoritative.
sqlalchemy.url = postgresql+psycopg://bagcibasi:bagcibasi_dev_password@localhost:5432/bagcibasi_logistics

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
