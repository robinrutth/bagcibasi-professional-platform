{% extends "base.html" %}
{% block content %}
<h1 style="margin:0 0 16px;font-size:22px;color:#111827;">Sevkiyatınız teslim edildi</h1>
<p>Merhaba {{ customer.name }}, #{{ shipment.id }} numaralı sevkiyatınız teslim edildi.</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:16px;border-collapse:collapse;">
  <tr><td style="padding:8px;border-bottom:1px solid #e5e7eb;">Rota</td><td style="padding:8px;border-bottom:1px solid #e5e7eb;">{{ route }}</td></tr>
  <tr><td style="padding:8px;border-bottom:1px solid #e5e7eb;">Toplam karbon emisyonu</td><td style="padding:8px;border-bottom:1px solid #e5e7eb;">{{ "%.2f"|format(shipment.co2_kg) }} kg CO2</td></tr>
</table>
{% endblock %}
